services:
  pocketbase:
    build:
      context: ./services/pocketbase
      args:
        PB_VERSION: "0.41.1"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@local-git.test}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-change-this-password}
    command: ["/pb/pocketbase", "serve", "--http=0.0.0.0:8091", "--dir=/pb/pb_data", "--migrationsDir=/pb/pb_migrations"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/pocketbase:/pb/pb_data
      - ./services/pocketbase/pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  arsy:
    build:
      context: ./services/arsy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      ARSY_PORT: "4000"
      HOST: 0.0.0.0
      ARSY_SERVICE_TOKEN: ${ARSY_SERVICE_TOKEN:?ARSY_SERVICE_TOKEN required}
      LEGEND_ENDPOINT: http://legend:8092
      LEGEND_SERVICE_TOKEN: ${LEGEND_SERVICE_TOKEN:?LEGEND_SERVICE_TOKEN required}
    restart: unless-stopped
    depends_on:
      legend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  radius:
    build:
      context: ./services/radius
      dockerfile: Dockerfile
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    env_file:
      - ./services/radius/.env.example
    environment:
      ARSY_SERVICE_TOKEN: ${ARSY_SERVICE_TOKEN:?ARSY_SERVICE_TOKEN required}
    restart: unless-stopped
    depends_on:
      arsy:
        condition: service_healthy

  legend:
    build:
      context: ./services/legend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8092:8092"
    environment:
      LEGEND_HOST: 0.0.0.0
      LEGEND_PORT: "8092"
      LEGEND_DATA_PATH: /data/legend.db
      LEGEND_SERVICE_TOKEN: ${LEGEND_SERVICE_TOKEN:?LEGEND_SERVICE_TOKEN required}
      LEGEND_ADMIN_TOKEN: ${LEGEND_ADMIN_TOKEN:?LEGEND_ADMIN_TOKEN required}
      LEGEND_CORS_ORIGINS: ${LEGEND_CORS_ORIGINS:-http://127.0.0.1:3003}
    volumes:
      - ./data/legend:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/legend", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
