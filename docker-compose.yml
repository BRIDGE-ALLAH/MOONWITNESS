services:
  pocketbase:
    build:
      context: ./services/pocketbase
      args:
        PB_VERSION: "0.41.1"
    restart: unless-stopped
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-admin@local-git.test}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-change-this-password}
    command: ["/pb/pocketbase", "serve", "--http=0.0.0.0:8091", "--dir=/pb/pb_data", "--migrationsDir=/pb/pb_migrations"]
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data/pocketbase:/pb/pb_data
      - ./services/pocketbase/pb_migrations:/pb/pb_migrations
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 10s

  arsy:
    build:
      context: ./services/arsy
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - HOST=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  radius:
    build:
      context: ./services/radius
      dockerfile: Dockerfile
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    env_file:
      - ./services/radius/.env.example
    depends_on:
      arsy:
        condition: service_healthy
    restart: unless-stopped
