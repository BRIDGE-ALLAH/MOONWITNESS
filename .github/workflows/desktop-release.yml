name: Sovereign Desktop CI/CD Binary Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build & Release Sovereign Desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'Sovereign-Desktop-Setup.exe'
          - platform: 'ubuntu-22.04'
            args: ''
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'sovereign-desktop.AppImage'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node & Workspace Dependencies
        run: bun install

      - name: Build Sovereign Desktop UI
        run: |
          cd apps/sovereign-desktop/ui
          bun install
          bun run build

      - name: Compile Sovereign Desktop Native Rust Binary
        run: |
          cargo build --release --manifest-path apps/sovereign-desktop/Cargo.toml

      - name: Upload Build Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            apps/sovereign-desktop/target/release/sovereign-desktop.exe
            apps/sovereign-desktop/target/release/sovereign-desktop
            target/release/sovereign-desktop.exe
            target/release/sovereign-desktop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
