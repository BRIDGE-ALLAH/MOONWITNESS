name: Sovereign Desktop CI/CD Binary Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build & Release Sovereign Windows Desktop
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node & Workspace Dependencies
        run: bun install

      - name: Build Sovereign Desktop UI
        run: |
          cd apps/sovereign-desktop/ui
          bun install
          bun run build

      - name: Compile Sovereign Desktop Native Rust Binary
        run: |
          cargo build --release --manifest-path apps/sovereign-desktop/Cargo.toml

      - name: Upload Build Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          fail_on_unmatched_files: false
          files: |
            apps/sovereign-desktop/target/release/sovereign-desktop.exe
            target/release/sovereign-desktop.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
