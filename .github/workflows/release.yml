name: Sovereign Release Automation

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: write
  pull-requests: write
  packages: write
  attestations: write
  id-token: write

jobs:
  release-please:
    name: Automated SemVer & Changelog PR
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  verify-and-publish:
    name: Gate, SBOM & GitHub Release
    needs: [release-please]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/legend
            services/radius

      - name: Install Workspace Dependencies
        run: bun install --frozen-lockfile

      - name: Run Full 5-Stage Sovereign Quality Gate
        run: bun run gate

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          upload-release-assets: false

      - name: Attest SBOM Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: sbom.cyclonedx.json

      - name: Publish Release & Attach SBOM
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
          generate_release_notes: true
          body_path: CHANGELOG.md
          files: sbom.cyclonedx.json

  container-publish:
    name: Build, Sign & Push GHCR — ${{ matrix.service }}
    needs: [release-please, verify-and-publish]
    if: always() && needs.verify-and-publish.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [legend, arsy, radius, pocketbase]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref_name }}

      - name: Normalize lowercase GHCR owner
        id: owner
        run: echo "owner_lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag_name || github.ref_name }}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Attest Container Build Provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.owner_lc }}/${{ matrix.service }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
