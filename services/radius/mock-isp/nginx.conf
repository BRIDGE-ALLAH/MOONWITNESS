events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        # Auth endpoints
        location /api/v1/auth/authenticate {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{\"authenticated\":true,\"user_id\":\"user_123\",\"profile\":{\"id\":\"profile_1\",\"username\":\"testuser\",\"speed_limit_down\":100000000,\"speed_limit_up\":50000000,\"quota_limit\":107374182400,\"static_ip\":\"10.0.0.100\",\"static_ipv6_prefix\":\"2001:db8::/64\"},\"error\":null}';
        }

        location /api/v1/auth/authorize {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{\"authorized\":true,\"framed_ip_address\":\"10.0.0.100\",\"framed_ipv6_prefix\":\"2001:db8::/64\",\"session_timeout\":86400,\"idle_timeout\":3600,\"error\":null}';
        }

        # Accounting endpoints
        location /api/v1/accounting/start {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{\"success\":true,\"message\":\"Accounting start recorded\"}';
        }

        location /api/v1/accounting/stop {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{\"success\":true,\"message\":\"Accounting stop recorded\"}';
        }

        location /api/v1/accounting/interim {
            add_header Content-Type application/json;
            add_header Access-Control-Allow-Origin *;
            return 200 '{\"success\":true,\"message\":\"Accounting interim recorded\"}';
        }

        # Health check
        location /health {
            add_header Content-Type application/json;
            return 200 '{\"status\":\"ok\",\"service\":\"e-isp\"}';
        }

        # Default
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}
